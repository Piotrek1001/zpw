<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zadania jquery</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <style>
        #kwadrat { width: 150px; height: 150px; background: lightgray; }
    </style>
        <script>
        $(function() {
            // $("button").on("click", function()
            // {
            //     console.log("test");
            // })

            // $("button").click(function()
            // {
            //     console.log("test2");
            // })

            // $("button").click(function()
            // {
            //     alert("Cześć!");
            // })

            $("button").click(function()
            {
                $("#komunikat").text("Cześć!");
            })

            $("#kwadrat").click(function()
            {
                $("#kwadrat").css("background-color", "red");
            })

            $("#reset").click(function()
            {
                $("#kwadrat").css("background-color", "lightgray");
                $("#komunikat").text("");
                $suma = 0;
            })

            let $suma = 0;
            $("#kwadrat").click(function()
            {
                $suma++;
                $("#komunikat").text("kliknięto kwadrat " + $suma + " razy");
            })
        });
    </script>
</head>
<body>
    <button id="przywitaj">Przywitaj się</button>
    <button id="reset">Resetuj</button>
    <p id="komunikat"></p>
    
    <div id="kwadrat"></div>


</body>
</html>
